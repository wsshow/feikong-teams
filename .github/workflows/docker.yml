name: docker

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  IMAGE: fkteams/fkteams

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      build_time: ${{ steps.release.outputs.build_time }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 .github/scripts/docker_release.py "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Check application
        run: |
          make check
          cd web && bun test src
      - name: Test release policy
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: docker/setup-buildx-action@v4
      - name: Test build context exclusions
        run: bash .github/scripts/docker_context_test.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # 仅上传候选 digest；两种架构均通过冒烟测试后才发布版本标签。
      - name: Build candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.check.outputs.version }}
            BUILD_TIME=${{ needs.check.outputs.build_time }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.created=${{ needs.check.outputs.build_time }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.arch }}
      - name: Smoke test candidate image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.check.outputs.version }}
          BUILD_TIME: ${{ needs.check.outputs.build_time }}
        run: bash .github/scripts/docker_smoke.sh "$IMAGE@$DIGEST" "$ARCH" "$VERSION" "$BUILD_TIME"
      - name: Export tested digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-platform manifest
        working-directory: ${{ runner.temp }}/digests
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sources=()
          for digest in *; do
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]] || exit 1
            sources+=("$IMAGE@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]] || exit 1
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG"
          docker buildx imagetools inspect --raw "$IMAGE:$RELEASE_TAG" | jq -e \
            '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'

  latest:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # 仅串行更新 latest，不让共享等待队列影响各版本标签的发布。
    concurrency:
      group: dockerhub-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Decide whether to update latest
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/docker_release.py "$RELEASE_TAG" --check-latest >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.release.outputs.latest == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Update latest from tested release
        if: steps.release.outputs.latest == 'true'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$RELEASE_TAG"
