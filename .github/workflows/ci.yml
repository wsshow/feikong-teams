name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check
        run: make check

      - name: Check Docker release scripts
        run: |
          python3 -m unittest discover -s .github/scripts -p 'test_*.py'
          bash -n .github/scripts/docker_smoke.sh .github/scripts/docker_context_test.sh
