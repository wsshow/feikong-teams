services:
  fkteams:
    image: fkteams/fkteams:latest
    container_name: fkteams
    restart: unless-stopped
    ports:
      - "23456:23456"
    environment:
      # 网络代理（可选）
      # - FEIKONG_PROXY_URL=http://host.docker.internal:7890

      # 应用数据目录（与 volumes 挂载路径对应）
      - FEIKONG_APP_DIR=/app
    volumes:
      # 整体保存配置、SQLite 数据库、工作区与扩展状态。
      - ./data:/app
